name: Content checks

# Every line the ideas server can write goes through the same guard as the app, and the two
# guards hold the same lists. Then the API server's tests, which also fail any request that
# makes more D1 queries than Cloudflare's free plan allows. Linux, a few seconds.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "server/**"
      - "Shared/IdeaGuard.swift"
      - ".github/workflows/content.yml"
  pull_request:
    paths:
      - "server/**"
      - "Shared/IdeaGuard.swift"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests, including the idea guard
        working-directory: server/local-ideas
        run: node --test
      - name: API server tests
        working-directory: server/api
        run: node --test --no-warnings
