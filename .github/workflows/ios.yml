name: iOS

# Minutes matter: macOS runners cost about 10x Linux. Pushes build and run the unit tests; the
# full simulator run with screenshots happens when the commit message contains [screenshots] or
# the workflow is started by hand. Once the repository is private (minutes are free only while
# it is public), a push runs this only when its message contains [ios] or [screenshots].
# main is not listed: it is always fast-forwarded to the work branch, so it would run twice.
on:
  push:
    branches: ["claude/**"]
    # Nothing here affects the app binary.
    paths-ignore:
      - "docs/**"
      - "server/**"
      - "fastlane/**"
      - ".github/workflows/testflight.yml"
      - "README.md"
  workflow_dispatch:
    inputs:
      full:
        description: Run tests and capture screenshots
        type: boolean
        default: true

env:
  FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full || contains(github.event.head_commit.message, '[screenshots]') }}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# Read-only for everything that builds or runs the app. The one write is the small Linux job at
# the end, which runs none of the project's code.
permissions:
  contents: read

jobs:
  build-test-screenshots:
    name: Build, test, screenshots
    # A [testflight] push runs the TestFlight workflow instead; no need to build twice.
    # And while the repository is private, only when asked: [ios], [screenshots], or by hand.
    if: ${{ !contains(github.event.head_commit.message, '[testflight]') && (!github.event.repository.private || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]') || contains(github.event.head_commit.message, '[screenshots]')) }}
    # Xcode 27.1 and its iOS 27.1 SDK: built with anything older, the app runs in a phone-sized
    # box on the iPhone Duo's inner display instead of filling it. The image also carries the
    # iPhone Duo simulator.
    runs-on: xcode-27
    # Normal pushes build and run the unit tests; a slow runner can spend 15 minutes on the build alone.
    # The full run also walks every screen on the iPhone Duo, upright and sideways.
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')) && 75 || 35 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Nothing in this job pushes, so the token is not left in .git/config for the build to read.
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          # The newest released Xcode by its own version number: real folders only, never a beta,
          # a release candidate or one of the image's links.
          XCODE=$(for x in $(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | grep -viE 'beta|release_candidate'); do
            echo "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$x/Contents/version.plist" 2>/dev/null || echo 0) $x"
          done | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -d' ' -f2-)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # awk reads everything, so xcodebuild never hits a closed pipe (head -1 made it abort once).
          MAJOR=$(xcodebuild -version 2>/dev/null | awk 'NR==1 {print $2}' | cut -d. -f1)
          echo "XCODE_MAJOR=$MAJOR" >> "$GITHUB_ENV"
          # The project targets iOS 26. Older Xcodes build it for iOS 18, which every API in use supports.
          if [ "$MAJOR" -lt 26 ]; then
            echo "DT_OVERRIDE=IPHONEOS_DEPLOYMENT_TARGET=18.0" >> "$GITHUB_ENV"
          else
            echo "DT_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      # Once only, while the app learns the iPhone Duo: the new SDK's exact signatures, since
      # Apple's documentation pages do not load from where the code is written.
      - name: iPhone Duo SDK probe
        continue-on-error: true
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          PLAT=$(xcrun --sdk iphonesimulator --show-sdk-platform-path)
          echo "SDK $SDK"
          PATTERN='reservedRegion|ReservedRegion|ArrangementView|arrangementViewStyle|ArrangementStyle|onHingeChange|HingeContext|HingeStatus|struct Hinge|toolbarVerticalBehavior|ToolbarVerticalBehavior|axisBehavior|AxisBehavior|defaultTabBarPlacement|TabBarPlacement|toolbarVerticalEdge|overlayArrangementZIndex|toolbarVerticalCompressionBehavior|visibilityPriority'
          for f in $(find "$SDK/System/Library/Frameworks" -maxdepth 4 -path '*SwiftUI*' -name '*.swiftinterface' | grep -E 'arm64e?-apple-ios\.swiftinterface$'); do
            echo "== $f"
            grep -n -B3 -E "$PATTERN" "$f" | cut -c1-260 | head -400
          done
          echo "== UIKit headers"
          grep -rn -E 'ReservedRegion|reservedRegions|UIHingeInteraction|UIHinge|verticalBarEdge|UIVerticalBarBehavior|preferredVerticalBarBehavior|axisBehavior' "$SDK/System/Library/Frameworks/UIKit.framework/Headers" | cut -c1-260 | head -120
          echo "== XCTest and XCUIAutomation"
          grep -rn -i -E 'hinge|fold|posture|devicePose|XCUIDevicePose|display' "$PLAT/Developer/Library/Frameworks/XCTest.framework/Headers" "$PLAT/Developer/Library/Frameworks/XCUIAutomation.framework/Headers" 2>/dev/null | cut -c1-260 | head -80
          for f in $(find "$PLAT/Developer/Library/Frameworks" -maxdepth 5 -name '*.swiftinterface' | grep -i -E 'XCUIAutomation|XCTest' | grep -E 'arm64-apple-ios-simulator'); do
            echo "== $f"
            grep -n -i -E 'hinge|fold|posture|pose\b|Pose ' "$f" | cut -c1-260 | head -60
          done
          echo "== simctl"
          xcrun simctl help 2>&1 | head -70
          xcrun simctl list devicetypes 2>&1 | grep -i -E 'duo|fold' || true
          xcrun simctl help io 2>&1 | head -40
          xcrun simctl help ui 2>&1 | head -40

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulators
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > devices.json
          python3 scripts/pick_simulators.py devices.json >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Sundae.xcodeproj -scheme Sundae \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            $DT_OVERRIDE \
            2>&1 | tee build.log | grep -E "error:|warning: .*(never|unused)|BUILD (SUCCEEDED|FAILED)|Compiling|Linking" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Unit tests, including the idea guard
        if: env.FULL != 'true'
        run: |
          set -o pipefail
          xcrun simctl boot "$IPHONE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$IPHONE_UDID" -b || true
          xcodebuild test-without-building \
            -project Sundae.xcodeproj -scheme Sundae \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -derivedDataPath build \
            -only-testing:SundaeTests \
            2>&1 | tee test-unit.log | grep -E "error:|failed|passed|recorded an issue|TEST .*(SUCCEEDED|FAILED)" || true
          grep -Eq "TEST (EXECUTE )?SUCCEEDED" test-unit.log

      - name: Unit and UI tests on iPhone
        if: env.FULL == 'true'
        run: |
          set -o pipefail
          mkdir -p screenshots
          xcrun simctl boot "$IPHONE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$IPHONE_UDID" -b || true
          APP=$(find build/Build/Products -maxdepth 2 -name "Sundae.app" | head -1)
          [ -n "$APP" ] && xcrun simctl install "$IPHONE_UDID" "$APP" || true
          xcrun simctl privacy "$IPHONE_UDID" grant photos com.jonmooreai.sundae || true
          # A few real photos in the camera roll, dated today, so "this week" has something to pick.
          mkdir -p seed-photos
          for i in 1 2 3 4 5 6; do
            curl -sL --max-time 20 -o "seed-photos/week-$i.jpg" "https://picsum.photos/seed/sundae-roll-$i/1200/900" || true
          done
          ls -la seed-photos || true
          xcrun simctl addmedia "$IPHONE_UDID" seed-photos/*.jpg || true
          xcodebuild test-without-building \
            -project Sundae.xcodeproj -scheme Sundae \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -derivedDataPath build \
            -resultBundlePath results/iphone.xcresult \
            -skip-testing:SundaeUITests/LandscapeScreenshotTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            SCREENSHOT_DIR="$PWD/screenshots" \
            2>&1 | tee test-iphone.log | grep -E "Test Case|error:|failed|passed|TEST .*(SUCCEEDED|FAILED)" || true
          grep -Eq "TEST (EXECUTE )?SUCCEEDED" test-iphone.log

      - name: Every screen on iPhone Duo, upright and sideways
        if: env.FULL == 'true' && env.DUO_UDID != ''
        run: |
          set -o pipefail
          # Nothing here may wait forever: the first run hung for 44 minutes with no word. Each
          # wait has a limit (perl's alarm, since macOS has no timeout command), each test is
          # allowed five minutes, and the whole pass forty.
          xcrun simctl boot "$DUO_UDID" 2>/dev/null || true
          perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl bootstatus "$DUO_UDID" -b || echo "::warning::iPhone Duo did not finish booting in 5 minutes"
          xcrun simctl list devices | grep -i "duo" || true
          APP=$(find build/Build/Products -maxdepth 2 -name "Sundae.app" | head -1)
          [ -n "$APP" ] && perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl install "$DUO_UDID" "$APP" || echo "::warning::install did not finish"
          xcrun simctl privacy "$DUO_UDID" grant photos com.jonmooreai.sundae || true
          ls seed-photos/*.jpg >/dev/null 2>&1 && xcrun simctl addmedia "$DUO_UDID" seed-photos/*.jpg || true
          perl -e 'alarm shift; exec @ARGV' 2400 xcodebuild test-without-building \
            -project Sundae.xcodeproj -scheme Sundae \
            -destination "platform=iOS Simulator,id=$DUO_UDID" \
            -derivedDataPath build \
            -resultBundlePath results/duo.xcresult \
            -only-testing:SundaeUITests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            2>&1 | tee test-duo.log | grep -E "Test Case|error:|failed|passed|\[screens\]|TEST .*(SUCCEEDED|FAILED)" || true
          grep -Eq "TEST (EXECUTE )?SUCCEEDED" test-duo.log

      - name: Export screenshots from result bundles
        if: always() && env.FULL == 'true'
        run: |
          set -euo pipefail
          for bundle in results/*.xcresult; do
            [ -d "$bundle" ] || continue
            out="exported/$(basename "$bundle" .xcresult)"
            mkdir -p "$out"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$out" || true
          done
          python3 scripts/collect_screenshots.py exported screenshots docs/screenshots
          ls -la docs/screenshots || true

      - name: Upload artifacts
        if: always() && env.FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sundae-${{ github.run_number }}
          path: |
            docs/screenshots
            build.log
            test-*.log
          if-no-files-found: ignore

  commit-screenshots:
    name: Commit screenshots
    needs: build-test-screenshots
    # The same test as FULL above; a job's condition cannot read env.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full || contains(github.event.head_commit.message, '[screenshots]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write. It runs git and GitHub's own actions, nothing from the project
    # or its packages, and takes only the screenshot PNGs from the build job's artifact.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: sundae-${{ github.run_number }}
          path: ${{ runner.temp }}/artifact

      - name: Commit screenshots to the branch
        run: |
          set -euo pipefail
          # The artifact holds the screenshots and the logs; its layout depends on which were
          # uploaded, so take the PNGs from wherever they landed.
          shots="$RUNNER_TEMP/artifact"
          if [ -z "$(find "$shots" -maxdepth 3 -type f -name '*.png' 2>/dev/null)" ]; then
            echo "No screenshots to commit"; exit 0
          fi
          mkdir -p docs/screenshots
          find "$shots" -maxdepth 3 -type f -name '*.png' -exec cp {} docs/screenshots/ \;
          git config user.name "sundae-ci"
          git config user.email "sundae-ci@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "Update simulator screenshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
