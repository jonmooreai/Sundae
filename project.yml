# XcodeGen spec. Run `xcodegen generate` to produce Sundae.xcodeproj.
name: Sundae
options:
  bundleIdPrefix: com.jonmooreai
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Sundae:
    type: application
    platform: iOS
    sources:
      - path: Sundae
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonmooreai.sundae
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sundae/Info.plist
      properties:
        CFBundleDisplayName: Sundae
        CFBundleName: Sundae
        # sundae:// is only for the large widget's Maps buttons (WidgetSnapshot.mapsLink).
        CFBundleURLTypes:
          - CFBundleURLName: com.jonmooreai.sundae
            CFBundleURLSchemes: [sundae]
        # XcodeGen would write literal 1 / 1.0 here; these follow the build settings instead,
        # so CI can stamp each TestFlight build with its run number.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # The friends-and-family server (docs/SERVER.md). Empty would mean built-in demo data.
        SundaeAPIBaseURL: "https://sundae-api.sundae-fam.workers.dev"
        # Set to group.com.jonmooreai.sundae (here and in the widget) once the App ID has the app group.
        SundaeAppGroup: ""
        # Where the app leaves state for the widget. The team prefix comes from signing; the
        # profiles' TEAMID.* keychain wildcard already allows it, so no portal setup is needed.
        SundaeKeychainGroup: "$(AppIdentifierPrefix)com.jonmooreai.sundae.shared"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSPhotoLibraryUsageDescription: Sundae uses your library to show this week's photos first when you post on Sunday, and to find the photos you take at places you saved. Photos stay on your device until you choose to post them.
        NSFaceIDUsageDescription: Sundae asks for Face ID before sensitive changes like deleting your account.
        NSLocationWhenInUseUsageDescription: Sundae uses your location only Monday to Saturday, to pick today's idea near you. Never on Sunday, never on your photos, never shown to anyone.
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
    # Sign in with Apple is turned on for the App ID by the TestFlight lane itself. Push still needs
    # its capability before it can be signed (see docs/TESTFLIGHT.md).
    entitlements:
      path: Sundae/Sundae.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # The app's own group first, so session tokens keep landing there; the shared one second.
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.jonmooreai.sundae"
          - "$(AppIdentifierPrefix)com.jonmooreai.sundae.shared"
    dependencies:
      - target: SundaeWidget
        embed: true
  SundaeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SundaeWidget
        excludes:
          - Info.plist
      - path: Shared
        # The privacy text is for the app's Privacy screen; the widget never shows it.
        excludes:
          - privacy.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonmooreai.sundae.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SundaeWidget/Info.plist
      properties:
        CFBundleDisplayName: Sundae
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        SundaeAppGroup: ""
        SundaeKeychainGroup: "$(AppIdentifierPrefix)com.jonmooreai.sundae.shared"
        NSPhotoLibraryUsageDescription: On Sunday the widget shows a few photos you took this week, using the same Photos access as the app. Nothing is copied or uploaded.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SundaeWidget/SundaeWidget.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.jonmooreai.sundae.widget"
          - "$(AppIdentifierPrefix)com.jonmooreai.sundae.shared"
  SundaeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SundaeTests
    dependencies:
      - target: Sundae
  SundaeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SundaeUITests
    dependencies:
      - target: Sundae
schemes:
  Sundae:
    build:
      targets:
        Sundae: all
        SundaeWidget: all
        SundaeTests: [test]
        SundaeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SundaeTests
        - SundaeUITests
