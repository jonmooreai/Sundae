# XcodeGen spec. Run `xcodegen generate` to produce Sundae.xcodeproj.
name: Sundae
options:
  bundleIdPrefix: com.jonmooreai
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  PhosphorSwift:
    url: https://github.com/phosphor-icons/swift
    from: "2.0.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Sundae:
    type: application
    platform: iOS
    sources:
      - path: Sundae
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonmooreai.sundae
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sundae/Info.plist
      properties:
        CFBundleDisplayName: Sundae
        # XcodeGen would write literal 1 / 1.0 here; these follow the build settings instead,
        # so CI can stamp each TestFlight build with its run number.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        SundaeAPIBaseURL: ""
        # Set to group.com.jonmooreai.sundae (here and in the widget) once the App ID has the app group.
        SundaeAppGroup: ""
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSPhotoLibraryUsageDescription: Sundae uses your library to show this week's photos first when you post on Sunday. Photos stay on your device until you choose to post them.
        NSContactsUsageDescription: Sundae can match hashed phone numbers to find friends already here. Hashes are discarded after matching.
        NSFaceIDUsageDescription: Sundae asks for Face ID before sensitive changes like deleting your account.
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
    # Sign in with Apple, app groups and push need capabilities on the App ID before they can be
    # signed. They come back once the developer account has them (see docs/TESTFLIGHT.md).
    entitlements:
      path: Sundae/Sundae.entitlements
      properties: {}
    dependencies:
      - target: SundaeWidget
        embed: true
      - package: PhosphorSwift
  SundaeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SundaeWidget
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonmooreai.sundae.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SundaeWidget/Info.plist
      properties:
        CFBundleDisplayName: Sundae
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        SundaeAppGroup: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SundaeWidget/SundaeWidget.entitlements
      properties: {}
  SundaeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SundaeTests
    dependencies:
      - target: Sundae
  SundaeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SundaeUITests
    dependencies:
      - target: Sundae
schemes:
  Sundae:
    build:
      targets:
        Sundae: all
        SundaeWidget: all
        SundaeTests: [test]
        SundaeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SundaeTests
        - SundaeUITests
